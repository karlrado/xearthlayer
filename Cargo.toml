[workspace]
resolver = "2"
members = [
    "xearthlayer",
    "xearthlayer-cli",
    "xearthlayer-package",
    "xearthlayer-publisher",
    "xearthlayer-publish",
]

[workspace.package]
# On `main` and `release/*` this is the released stable version. On a
# `develop/X.Y.Z` line it instead carries a pre-release identifier, which sorts
# below the target release per semver, and is bumped to the dated X.Y.Z only at
# stable promotion. See docs/dev/app-release-runbook.md.
version = "0.5.0-rc.1"
edition = "2021"
authors = ["XEarthLayer Contributors"]
license = "MIT"
# Minimum supported Rust, matching the pin in rust-toolchain.toml. rustup users
# get that pin automatically and never notice; this field is what gives everyone
# else a clear "requires rustc 1.97.1, you have X" instead of an inscrutable
# rustfmt diff or a wall of compile errors. Bump both together.
rust-version = "1.97.1"
repository = "https://github.com/samsoir/xearthlayer"

[workspace.dependencies]
# Dependencies used by two or more workspace crates are declared once here so
# their versions cannot drift between manifests.
semver = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
regex = "1.10"
rayon = "1.10"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3.8"
# zlib-rs: pure-Rust deflate/inflate that picks SIMD (AVX2, SSE, NEON) at run
# time, so one binary is fast on every CPU. Package archives are built and
# extracted on it (#274).
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
clap = { version = "4.5", features = ["derive"] }

[profile.dev]
# Debug builds must process streams of any size, so integer-overflow traps
# are off, matching release.
#
# zlib's C ABI defines the `z_stream.total_in` / `total_out` byte counters
# as 32-bit values that *wrap by design* (zlib.h: "total_in may overflow if
# there is more than 4GiB of compressed data"), and zlib-rs follows that
# intent (e.g. `total_out` is advanced with `wrapping_add`). But at least
# one site advances `total_in` with a plain `+=` (zlib-rs `inflate.rs`),
# which panics under Rust's debug overflow-checks once the compressed
# stream passes 4 GiB. Real ortho packages are ~12 GB, so a debug build of
# `xearthlayer packages install` panicked mid-extract while the release
# build completed the same package fine. Disabling the traps in the dev
# profile keeps debug and release behaving identically on real-world data.
# Trade-off, accepted: a genuine overflow bug in *our* code now wraps
# silently in debug instead of panicking.
overflow-checks = false

[patch.crates-io]
# winfsp-sys 0.12.1 runs bindgen (needs libclang) at build time. We vendor the
# crate's shipped pre-generated bindings + import libraries instead, so
# Windows builds are hermetic: no libclang, no WinFSP install (the driver
# stays a runtime-only, delay-loaded dependency). See
# third-party/winfsp-sys/README.md and docs/dev/winfsp-backend.md §0.
winfsp-sys = { path = "third-party/winfsp-sys" }
