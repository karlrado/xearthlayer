name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'chore/**'
      - 'develop/**'
  pull_request:
    branches: [main, 'develop/**']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev

      - name: Run make verify
        run: make verify

  # macOS is a Tier 1 platform. Pinned to macos-15 (Apple Silicon) rather than
  # macos-latest: that label has moved across both OS versions and CPU
  # architectures, and a silent bump would surface as an unexplained failure on
  # an unrelated PR.
  #
  # No dependency-install step is needed. The pinned fuse3 fork is pure Rust
  # (no build.rs / pkg-config / cc) and xearthlayer/build.rs already emits
  # -lc++ for macOS. macFUSE is a runtime dependency only, and cannot be loaded
  # on hosted runners in any case (it is a kext).
  verify-macos:
    name: Verify (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run make verify
        run: make verify

  # Windows is a Tier 1 platform for this fork (Phase 2: WinFSP backend,
  # see docs/dev/winfsp-backend.md). No dependency-install step is needed:
  # winfsp-sys bundles its own import libraries and headers (WinFSP itself
  # is a runtime-only dependency, and a hosted runner cannot mount a file
  # system in any case — this job builds and unit-tests, never mounts), and
  # fuse3 is target-gated off on Windows, so there is no libfuse3-dev
  # equivalent to install.
  #
  # Runs scripts/verify.ps1 rather than `make verify`: hosted Windows images
  # ship no GNU make, and the script mirrors the Makefile's fmt/clippy/test
  # targets verbatim. test-scripts is deliberately not part of it — it is
  # the bash test suite for the macOS release tooling, covered by the Linux
  # job.
  verify-windows:
    name: Verify (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run verify.ps1
        run: powershell -ExecutionPolicy Bypass -File scripts/verify.ps1
