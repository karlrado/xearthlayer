name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'chore/**'
      - 'develop/**'
  pull_request:
    branches: [main, 'develop/**']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The pinned fuse3 crate is pure Rust (no -sys in the lock): the old
      # libfuse3-dev install was only a carrier for fusermount3. `fuse3`
      # installs fusermount3 directly, which is what a live mount needs.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3

      - name: Run make verify
        run: make verify

      # Live mounts through the mount seam (unprivileged fusermount3).
      # Blocking since the probe answered its question (2026-11-19): all
      # three live_mount tests passed on a hosted ubuntu-latest runner.
      # This is the only --ignored invocation in the workflow; the suite's
      # #[ignore] gate is what keeps it away from the macOS job (macFUSE is
      # a kext, unloadable on hosted runners) and away from `make verify`,
      # so only CI pays for real mounts and only Linux hosts run them. The
      # live macOS leg stays manual: `make verify-macos` on a real machine.
      - name: Live FUSE mount suite
        run: cargo test -p xearthlayer --test live_mount -- --ignored --nocapture

  # macOS is a Tier 1 platform. Pinned to macos-15 (Apple Silicon) rather than
  # macos-latest: that label has moved across both OS versions and CPU
  # architectures, and a silent bump would surface as an unexplained failure on
  # an unrelated PR.
  #
  # No dependency-install step is needed. The pinned fuse3 fork is pure Rust
  # (no build.rs / pkg-config / cc) and xearthlayer/build.rs already emits
  # -lc++ for macOS. macFUSE is a runtime dependency only, and cannot be loaded
  # on hosted runners in any case (it is a kext).
  verify-macos:
    name: Verify (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run make verify
        run: make verify
